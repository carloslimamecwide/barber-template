name: CI/CD - Build & Deploy

on:
  push:
    branches: [master]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    name: Build & Push Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=,suffix=
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to VPS
    needs: build
    runs-on: [self-hosted, Linux, X64]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create .env file
        run: |
          cat > .env <<EOF
          DATABASE_URL=${{ secrets.DATABASE_URL }}
          NEXT_PUBLIC_URL=${{ secrets.NEXT_PUBLIC_APP_URL }}
          RESEND_API_KEY=${{ secrets.RESEND_API_KEY }}
          SESSION_SECRET=${{ secrets.SESSION_SECRET }}
          CRON_SECRET=${{ secrets.CRON_SECRET }}
          BARBER_EMAIL=${{ secrets.BARBER_EMAIL }}
          BARBER_PASSWORD=${{ secrets.BARBER_PASSWORD }}
          EOF

      - name: Pull latest image
        run: docker compose pull app

      - name: Run Prisma db push
        run: |
          docker run --rm \
            --network data \
            --env-file .env \
            ghcr.io/carloslimamecwide/barbearia:latest \
            npx prisma db push --accept-data-loss

      - name: Deploy application
        run: docker compose up -d --remove-orphans

      - name: Clean up old images
        run: docker image prune -af

      - name: Health check
        run: |
          sleep 15
          curl -f http://localhost:3000 || exit 1
