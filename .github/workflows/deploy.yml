name: CI/CD - Build & Deploy

on:
  push:
    branches:
      - main

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    name: Build & Push Image
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=,suffix=
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to VPS
    needs: build
    runs-on:
      - self-hosted
      - Linux
      - X64

    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare deployment directory
        run: |
          cp docker-compose.yml /srv/apps/barber/docker-compose.yml

      - name: Create .env file
        working-directory: /srv/apps/barber
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          BARBER_EMAIL: ${{ secrets.BARBER_EMAIL }}
          BARBER_PASSWORD: ${{ secrets.BARBER_PASSWORD }}
        run: |
          {
            printf 'DATABASE_URL=%s\n' "$DATABASE_URL"
            printf 'NEXT_PUBLIC_APP_URL=%s\n' "$NEXT_PUBLIC_APP_URL"
            printf 'RESEND_API_KEY=%s\n' "$RESEND_API_KEY"
            printf 'SESSION_SECRET=%s\n' "$SESSION_SECRET"
            printf 'CRON_SECRET=%s\n' "$CRON_SECRET"
            printf 'BARBER_EMAIL=%s\n' "$BARBER_EMAIL"
            printf 'BARBER_PASSWORD=%s\n' "$BARBER_PASSWORD"
          } > .env

          chmod 600 .env

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull latest image
        working-directory: /srv/apps/barber
        run: docker compose -p barber-template pull app

      - name: Update database
        working-directory: /srv/apps/barber
        run: |
          docker run --rm \
            --network data \
            --env-file .env \
            "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest" \
            npx prisma db push

      - name: Deploy application
        working-directory: /srv/apps/barber
        run: |
          docker compose \
            -p barber-template \
            up -d --force-recreate --remove-orphans

      - name: Health check
        run: |
          for attempt in {1..12}; do
            STATUS="$(docker inspect \
              --format='{{.State.Health.Status}}' \
              barbearia-app 2>/dev/null || echo "not-found")"

            echo "Health status: ${STATUS} (${attempt}/12)"

            if [ "$STATUS" = "healthy" ]; then
              echo "Application is healthy."
              exit 0
            fi

            if [ "$STATUS" = "unhealthy" ]; then
              echo "Application is unhealthy."
              docker inspect barbearia-app \
                --format='{{range .State.Health.Log}}{{println .Output}}{{end}}'
              docker logs barbearia-app --tail 100
              exit 1
            fi

            sleep 5
          done

          echo "Application did not become healthy in time."

          docker inspect barbearia-app \
            --format='{{range .State.Health.Log}}{{println .Output}}{{end}}'

          docker logs barbearia-app --tail 100
          exit 1

      - name: Clean up old images
        if: success()
        run: docker image prune -f
