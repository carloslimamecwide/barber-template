version: "3.8"

services:
  app:
    image: ghcr.io/carloslimamecwide/barber-template:latest
    container_name: barbearia-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env
    networks:
      - data
      - apps
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

networks:
  data:
    external: true
  apps:
    external: true
